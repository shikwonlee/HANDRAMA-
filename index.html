<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>한드 · HANDRAMA</title>
<meta name="description" content="Dedicated home for Korean drama series and film with streaming information, episodes, ratings, and filters."/>
<meta property="og:title" content="한드 · HANDRAMA"/>
<meta property="og:description" content="Dedicated home for Korean drama series and film with streaming information, episodes, ratings, and filters."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#12131c;--ink2:#181a26;--ink3:#1f2230;
  --card:#1c1e2b;--card2:#242739;
  --rose:#c9536a;--rose2:#e0708a;
  --gold:#cbab6e;--celadon:#7d9a8a;
  --paper:#f3ede4;--text:#ece7e0;--muted:#8b8d9c;
  --border:#2a2d3d;--nav-h:64px;--px:52px;
  --serif:'Noto Serif KR',serif;--display:'Cormorant Garamond',serif;--sans:'Inter',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:var(--sans);overflow-x:hidden;min-height:100vh}
button,a{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);display:flex;align-items:center;padding:0 var(--px);gap:28px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
#nav.scrolled{background:rgba(18,19,28,.96);backdrop-filter:blur(10px);border-color:var(--border)}
.nav-logo{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:1px;color:var(--text);cursor:pointer;flex-shrink:0;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.nav-logo em{font-style:normal;color:var(--rose);font-size:15px;font-weight:400;letter-spacing:4px}
.nav-links{display:flex;gap:2px}
.nav-link{padding:8px 14px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);transition:color .2s;cursor:pointer;white-space:nowrap;position:relative}
.nav-link::after{content:'';position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--rose);transform:scaleX(0);transition:transform .25s;transform-origin:left}
.nav-link:hover,.nav-link.active{color:var(--text)}
.nav-link:hover::after,.nav-link.active::after{transform:scaleX(1)}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.search-wrap{position:relative;display:flex;align-items:center}
#search-input{background:transparent;border:none;border-bottom:1px solid var(--border);padding:6px 22px 6px 2px;font-size:13px;color:var(--text);width:150px;transition:width .3s,border-color .3s;font-family:var(--sans)}
#search-input:focus{outline:none;border-color:var(--rose);width:210px}
#search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;right:2px;color:var(--muted);pointer-events:none}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:12px;flex-shrink:0;color:#fff}

/* SCROLL TOP BUTTON */
#scroll-top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;z-index:900;opacity:0;pointer-events:none;transform:translateY(10px) scale(.9);transition:opacity .25s,transform .25s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#scroll-top.show{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
#scroll-top:hover{background:var(--rose2)}

/* MOBILE BOTTOM NAV */
.bottom-nav{display:none}
@media(max-width:900px){
  .bottom-nav{
    display:flex;position:fixed;left:12px;right:12px;bottom:14px;z-index:1000;
    background:rgba(28,30,43,.92);backdrop-filter:blur(14px);border:1px solid var(--border);
    border-radius:20px;padding:8px 4px;justify-content:space-around;align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35)
  }
  body{padding-bottom:78px}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.3px;padding:6px 4px;border-radius:14px;transition:color .18s,background .18s;flex:1;-webkit-tap-highlight-color:transparent}
  .bn-item svg{width:19px;height:19px}
  .bn-item.active{color:var(--rose);background:rgba(201,83,106,.12)}
  #scroll-top{bottom:92px;right:16px}
}

/* PAGES */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* FEATURED HERO CAROUSEL */
.hero-wrap { position:relative; padding:calc(var(--nav-h) + 24px) var(--px) 32px; }
.hero-carousel { display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; cursor:grab; }
.hero-carousel::-webkit-scrollbar { display:none; }
.hero-carousel:active { cursor:grabbing; }
.hero-card { flex:0 0 100%; position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border); aspect-ratio:21/9; min-height:55vh; scroll-snap-align:center; display:flex; align-items:stretch; background:var(--card); box-shadow:0 10px 30px rgba(0,0,0,0.25); }
.hc-bg { position:absolute; inset:0; background-size:cover; background-position:center 18%; filter:saturate(0.95); }
.hc-grad { position:absolute; inset:0; background:linear-gradient(100deg, var(--ink) 0%, var(--ink) 30%, rgba(18,19,28,0.7) 60%, transparent 100%); }
.hc-grad2 { position:absolute; inset:0; background:linear-gradient(to top, var(--ink) 0%, transparent 40%); }
.hc-content { position:relative; z-index:2; padding:50px; display:flex; flex-direction:column; justify-content:center; max-width:640px; }
.hc-eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
.hc-eyebrow-line { width:36px; height:1px; background:var(--rose); }
.hc-eyebrow span { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--rose); font-weight:600; }
.hc-title { font-family:var(--display); font-style:italic; font-weight:600; font-size:clamp(38px, 5vw, 64px); line-height:1.02; margin-bottom:16px; color:var(--paper); }
.hc-title-kr { font-family:var(--serif); font-style:normal; display:block; font-size:0.42em; font-weight:400; letter-spacing:2px; color:var(--muted); margin-top:6px; }
.hc-meta { display:flex; align-items:center; gap:16px; margin-bottom:16px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; font-family:var(--sans); }
.hc-rating { color:var(--gold); font-weight:700; display:flex; align-items:center; gap:4px; }
.hc-desc { font-size:14px; line-height:1.8; color:rgba(236,231,224,.8); margin-bottom:28px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; max-width:520px; }
.hc-btns { display:flex; gap:10px; flex-wrap:wrap; }

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:9px;background:var(--rose);color:#fff;padding:13px 26px;font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:background .18s,transform .15s;white-space:nowrap;border-radius:4px}
.btn-primary:hover{background:var(--rose2);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:transparent;color:var(--text);padding:12px 22px;font-size:12.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(236,231,224,.3);transition:border-color .18s,transform .15s,background .18s;white-space:nowrap;border-radius:4px}
.btn-ghost:hover{border-color:var(--text);background:rgba(255,255,255,.05);transform:translateY(-1px)}
.btn-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .18s;padding:4px 0}
.btn-back:hover{color:var(--text)}

/* SECTIONS — chapters */
.section{padding:30px 28px;margin:0 var(--px) 24px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
@media(max-width:600px){.section{margin:0 12px 18px;padding:22px 16px;border-radius:14px}}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;gap:16px}
.section-title-wrap{display:flex;align-items:baseline;gap:14px}
.section-num{font-family:var(--display);font-style:italic;font-size:16px;color:var(--rose);font-weight:600}
.section-title{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.3px}
.section-more{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 0;transition:color .18s;white-space:nowrap}
.section-more:hover{color:var(--rose)}
.section-rule{height:1px;background:var(--border);margin-bottom:24px}

/* CARD ROW - Improved Scroll */
.row-wrap{position:relative;margin:0 -10px}
.row{display:flex;gap:18px;overflow-x:auto;padding:4px 10px 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none;-webkit-user-select:none;scrollbar-width:none}
.row:active{cursor:grabbing}
.row::-webkit-scrollbar{display:none}
.scroll-btn{position:absolute;top:40%;transform:translateY(-50%);z-index:10;width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.scroll-btn:hover{border-color:var(--rose);color:var(--rose);background:var(--ink);transform:translateY(-50%) scale(1.1)}
.scroll-btn.sl{left:-14px}
.scroll-btn.sr{right:-14px}

/* POSTER CARD */
.card{flex:0 0 auto;width:164px;cursor:pointer;position:relative;scroll-snap-align:start;transition:transform .25s;-webkit-tap-highlight-color:transparent}
.card:hover{transform:translateY(-6px)}
.card:active{transform:scale(.97)}
.card-frame{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:box-shadow .25s}
.card:hover .card-frame{box-shadow:0 12px 26px rgba(0,0,0,.3)}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--card);filter:saturate(.95)}
.card-fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,19,28,.95) 0%,transparent 55%);opacity:0;transition:opacity .25s}
.card:hover .card-fade{opacity:1}
.card-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .25s;background:rgba(0,0,0,0.3)}
.card:hover .card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card-body{padding:12px 2px 0}
.card-name{font-family:var(--serif);font-size:13.5px;font-weight:600;line-height:1.35;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.card-rating{color:var(--gold);display:flex;align-items:center;gap:3px;font-weight:600}
.card-fav{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(18,19,28,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;opacity:0;transition:all .2s;border:1px solid rgba(255,255,255,.2)}
.card:hover .card-fav{opacity:1}
.card-fav:hover{background:rgba(18,19,28,.9);transform:scale(1.1)}
.card-fav.faved{opacity:1;background:rgba(201,83,106,.9);border-color:var(--rose)}
.cw-progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.2)}
.cw-bar{height:100%;background:var(--rose)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-poster{width:164px;aspect-ratio:2/3;flex:0 0 auto;border-radius:12px}
.sk-block{border-radius:6px}

/* FEATURED MASONRY (home only) */
.masonry{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:auto auto;gap:16px}
.mas-item{position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--border);background:var(--card);border-radius:12px}
.mas-item img{width:100%;height:100%;object-fit:cover;filter:saturate(.95);transition:transform .5s}
.mas-item:hover img{transform:scale(1.05)}
.mas-item.big{grid-row:span 2}
.mas-fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,19,28,.95) 0%,rgba(18,19,28,.15) 60%,transparent 100%)}
.mas-label{position:absolute;bottom:0;left:0;right:0;padding:20px}
.mas-name{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.3;margin-bottom:6px}
.mas-name.lg{font-size:22px}
.mas-meta{font-size:11px;color:var(--gold);letter-spacing:.5px;font-weight:600}

/* CONTINUE WATCHING */
.cw-card{flex:0 0 auto;width:250px;overflow:hidden;cursor:pointer;position:relative;scroll-snap-align:start;transition:transform .25s;background:var(--card);border:1px solid var(--border);border-radius:12px}
.cw-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.cw-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card2);filter:saturate(.95)}
.cw-body{padding:12px 14px 14px}
.cw-name{font-family:var(--serif);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.cw-meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cw-prog-wrap{height:3px;background:rgba(255,255,255,.12);margin-top:10px;border-radius:2px;overflow:hidden}
.cw-prog-bar{height:100%;background:var(--rose)}
.cw-remove{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(18,19,28,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s;color:var(--muted);font-size:12px;border:1px solid rgba(255,255,255,.2)}
.cw-card:hover .cw-remove{opacity:1}
.cw-remove:hover{background:var(--rose);color:#fff;border-color:var(--rose)}

/* DETAIL PAGE */
.dp{padding-top:var(--nav-h);min-height:100vh}
.dp-hero{position:relative;min-height:78vh;overflow:hidden;border-bottom:1px solid var(--border)}
.dp-bg{position:absolute;inset:0;background-size:cover;background-position:center 18%}
.dp-grad{position:absolute;inset:0;background:linear-gradient(105deg,var(--ink) 28%,transparent 72%),linear-gradient(to top,var(--ink) 0%,transparent 46%)}
.dp-inner{position:relative;z-index:2;min-height:78vh;display:flex;align-items:flex-end;padding:calc(var(--nav-h) + 40px) var(--px) 50px;gap:36px}
.dp-poster{width:180px;flex-shrink:0;overflow:hidden;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dp-poster img{width:100%;aspect-ratio:2/3;object-fit:cover}
.dp-info{flex:1;min-width:0;max-width:700px}
.genre-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.genre-tag{padding:5px 14px;border:1px solid var(--rose);border-radius:20px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--rose);font-weight:600;background:rgba(201,83,106,.05)}
.dp-title{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(32px,5vw,56px);line-height:1.03;margin-bottom:14px;color:var(--paper)}
.dp-meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:18px;font-weight:500}
.dp-rating{display:flex;align-items:center;gap:6px;color:var(--gold);font-size:16px;font-weight:700;font-family:var(--sans)}
.dp-desc{font-size:14.5px;line-height:1.85;color:rgba(236,231,224,.8);margin-bottom:30px}
.dp-btns{display:flex;gap:12px;flex-wrap:wrap}
.dp-body{padding:40px var(--px)}
.cast-row{display:flex;gap:20px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cast-row::-webkit-scrollbar{display:none}
.cast-card{flex:0 0 auto;width:90px;text-align:center}
.cast-img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:var(--card);margin:0 auto 10px;border:1px solid var(--border);filter:saturate(.95);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.cast-name{font-size:11px;font-weight:600;line-height:1.3}
.cast-char{font-size:10px;color:var(--muted);margin-top:4px;font-style:italic;font-family:var(--display)}

/* BROWSE */
.browse-pg{padding:calc(var(--nav-h) + 40px) var(--px) 60px}
.browse-title{font-family:var(--display);font-style:italic;font-weight:600;font-size:48px;margin-bottom:8px}
.browse-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.filter-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.filter-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;width:70px;flex-shrink:0}
.filter-scroll-wrap{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;flex:1 1 auto;min-width:0;scroll-behavior:smooth}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-arrow{display:none;flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--text);align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,.25);z-index:5}
.filter-arrow:hover{border-color:var(--rose);color:var(--rose);background:var(--ink)}
.filter-arrow.fal{margin-right:6px}
.filter-arrow.far{margin-left:6px}
.fbtn{padding:8px 18px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.5px;border-radius:20px;cursor:pointer;transition:all .2s;font-family:inherit;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.fbtn:hover{border-color:var(--rose);color:var(--text)}
.fbtn.active{background:var(--rose);border-color:var(--rose);color:#fff}
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:24px 18px;margin-top:32px}

/* SEARCH */
.search-pg{padding:calc(var(--nav-h) + 40px) var(--px) 60px}
.search-heading{font-family:var(--display);font-style:italic;font-weight:600;font-size:32px;margin-bottom:28px}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:24px 18px}

/* PLAYER */
.player-pg{background:#000;min-height:100vh;padding-top:var(--nav-h)}
.player-top{padding:16px var(--px);display:flex;align-items:center;gap:16px;background:var(--ink2);border-bottom:1px solid var(--border)}
.player-frame-wrap{max-width:1280px;margin:0 auto;background:#000;position:relative}
.player-frame-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.fs-btn{position:absolute;bottom:14px;right:14px;z-index:60;width:42px;height:42px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .3s,background .2s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.fs-btn:hover{background:rgba(0,0,0,.8)}
.player-frame-wrap.controls-hidden .fs-btn{opacity:0;pointer-events:none}
.player-frame-wrap.controls-hidden{cursor:none}
.player-frame-wrap:fullscreen{background:#000}
.player-frame-wrap:fullscreen iframe{width:100vw;height:100vh;aspect-ratio:auto}
.player-frame-wrap:-webkit-full-screen iframe{width:100vw;height:100vh}
.player-body{max-width:1280px;margin:0 auto;padding:26px var(--px) 40px}
.player-title{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:8px}
.player-sub{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;font-weight:500}
.player-note{margin-top:20px;background:var(--card);border:1px solid var(--border);padding:16px 20px;font-size:13px;color:var(--muted);line-height:1.7;border-radius:8px}
.source-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.src-btn{padding:10px 18px;background:var(--card);border:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);cursor:pointer;transition:all .2s;font-family:inherit;text-transform:uppercase;border-radius:4px}
.src-btn:hover{border-color:var(--rose);color:var(--text)}
.src-btn.active{background:var(--rose);border-color:var(--rose);color:#fff}

/* EPISODE PANEL */
.ep-panel{max-width:1280px;margin:0 auto;padding:0 var(--px) 50px}
.ep-section-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:18px;padding-top:30px;border-top:1px solid var(--border)}
.season-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.season-tab{padding:8px 20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:inherit;border-radius:20px;-webkit-tap-highlight-color:transparent}
.season-tab:hover{border-color:var(--rose);color:var(--text)}
.season-tab.active{background:var(--rose);border-color:var(--rose);color:#fff}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.ep-card{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s;border-radius:8px;-webkit-tap-highlight-color:transparent}
.ep-card:hover{border-color:var(--rose);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.ep-card.active{border-color:var(--rose);background:var(--card2)}
.ep-card.active .ep-num{color:var(--rose)}
.ep-thumb-wrap{position:relative;flex-shrink:0;width:130px}
.ep-thumb{width:130px;height:78px;object-fit:cover;background:var(--ink3);display:block;filter:saturate(.95)}
.ep-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,19,28,.4);opacity:0;transition:opacity .2s}
.ep-card:hover .ep-play-overlay,.ep-card.active .ep-play-overlay{opacity:1}
.ep-body2{padding:12px 12px 12px 0;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ep-num{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
.ep-name{font-family:var(--serif);font-size:13px;font-weight:600;line-height:1.4;margin-bottom:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep-desc{font-size:11.5px;color:var(--muted);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep-runtime{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:500}
.ep-nav-bar{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.ep-nav-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);padding:11px 20px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text);cursor:pointer;transition:all .2s;font-family:inherit;border-radius:4px}
.ep-nav-btn:hover:not(:disabled){background:var(--rose);border-color:var(--rose);color:#fff}
.ep-nav-btn:disabled{opacity:.4;cursor:not-allowed}
.ep-now-playing{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ep-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border);padding:14px 20px;font-size:13.5px;z-index:9999;opacity:0;transform:translateY(12px);transition:all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);pointer-events:none;max-width:300px;font-family:var(--sans);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateY(0)}

/* FOOTER */
footer{background:var(--ink2);border-top:1px solid var(--border);padding:50px var(--px) 34px;margin-top:60px}
.footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:40px;margin-bottom:36px}
.footer-brand .nav-logo{font-size:19px;margin-bottom:12px;display:flex}
.footer-brand p{font-size:13px;color:var(--muted);line-height:1.8;max-width:280px}
.footer-col h4{font-family:var(--serif);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;color:var(--rose)}
.footer-col a{display:block;font-size:13.5px;color:var(--muted);margin-bottom:12px;cursor:pointer;transition:color .2s;font-weight:500}
.footer-col a:hover{color:var(--text)}
.footer-bottom{border-top:1px solid var(--border);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;gap:12px}
.tmdb-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tmdb-badge span{background:#01b4e4;color:#000;padding:3px 8px;font-weight:700;font-size:10.5px;border-radius:3px}

/* MOBILE DRAWER */
.mobile-search-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:1200;background:rgba(18,19,28,.98);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 16px;gap:12px;align-items:center}
.mobile-search-bar.open{display:flex}
.mobile-search-bar input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);padding:8px 4px;font-size:15px;color:var(--text);font-family:inherit}
.mobile-search-bar input:focus{outline:none;border-color:var(--rose)}
.mobile-search-bar input::placeholder{color:var(--muted)}
.mobile-search-bar button{color:var(--muted);flex-shrink:0;padding:4px}
.mobile-search-bar button:hover{color:var(--text)}

/* RESPONSIVE */
@media(max-width:900px){
  :root{--px:20px;--nav-h:58px}
  .nav-links,.search-wrap{display:none}
  .footer-grid{grid-template-columns:1fr 1fr}
  .dp-poster{display:none}
  .scroll-btn{display:none}
  .filter-arrow{display:flex}
  .hero-card{aspect-ratio:16/9; min-height:60vh}
  .hc-content{padding:30px}
  .masonry{grid-template-columns:1fr 1fr}
  .mas-item.big{grid-row:span 1}
}
@media(max-width:600px){
  :root{--px:16px}
  .hc-title{font-size:32px}
  .hc-desc{-webkit-line-clamp:2}
  .hero-card{aspect-ratio:3/4; min-height:65vh; flex:0 0 calc(100vw - var(--px) * 2)}
  .hc-content{padding:24px; justify-content:flex-end}
  .btn-primary,.btn-ghost{padding:12px 18px;font-size:12px}
  .card{width:134px}
  .sk-poster{width:134px}
  .browse-grid,.results-grid{grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:16px 12px}
  .footer-grid{grid-template-columns:1fr}
  .dp-title{font-size:30px}
  .dp-inner{padding:calc(var(--nav-h) + 24px) var(--px) 32px}
  .browse-title{font-size:36px}
  .filter-group{flex-direction:column;align-items:flex-start;gap:6px}
  .filter-label{width:auto}
  .filter-scroll-wrap{width:100%}
  .masonry{grid-template-columns:1fr}
  .mas-item{aspect-ratio:16/9}
  #toast{right:12px;bottom:12px;left:12px;max-width:none}
}
@media(hover:none){
  .card-fade{opacity:1}
  .card-fav{opacity:1}
}
</style>

<body>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

<script>
/* ============================================================
   CONFIG — Korean-only. Always dark.
   ============================================================ */
const BEARER='eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlOTk0YTNmMzc5MDg1YzQyZGI4MTM2NTk4NmI5MTRkYiIsIm5iZiI6MTc3OTE2NzYxNC45NzcsInN1YiI6IjZhMGJmMTdlOGZjMzhmZjJmNzhmYWM0YSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.BL9wtf4C5ZujQqtRUXfu5EfWNwjM4EUJYzSPX_LsJGw';
const IMG='https://image.tmdb.org/t/p/';
const BASE='https://api.themoviedb.org/3';
const H={Authorization:'Bearer '+BEARER,'Content-Type':'application/json'};
const KO='ko';

const SOURCES=[
  {label:'VidSrc.me',  urlMovie:id=>`https://vidsrc.me/embed/movie?tmdb=${id}`,  urlTV:(id,s,e)=>`https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`},
  {label:'VidSrc Pro', urlMovie:id=>`https://vidsrc.pro/embed/movie/${id}`,       urlTV:(id,s,e)=>`https://vidsrc.pro/embed/tv/${id}/${s}/${e}`},
  {label:'VidSrc',     urlMovie:id=>`https://vidsrc.xyz/embed/movie/${id}`,       urlTV:(id,s,e)=>`https://vidsrc.xyz/embed/tv/${id}/${s}/${e}`},
  {label:'2Embed',     urlMovie:id=>`https://www.2embed.cc/embed/${id}`,          urlTV:(id,s,e)=>`https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`},
  {label:'SuperEmbed', urlMovie:id=>`https://multiembed.mov/?video_id=${id}&tmdb=1`, urlTV:(id,s,e)=>`https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`},
];
let _activeSrc=0;
let _currentPlay={id:null,type:null,season:1,episode:1,totalEp:0};
let _tvSeasons=[];
let _tvEpisodes=[];
let _autoSwipeInterval = null;

const DRAMA_GENRES=[
  {id:18,   label:'Romance & Melodrama', gid:10749},
  {id:9648, label:'Mystery & Thriller'},
  {id:35,   label:'Comedy'},
  {id:10768,label:'Historical (Sageuk)'},
  {id:10759,label:'Action & Adventure'},
  {id:10765,label:'Fantasy & Sci-Fi'},
];
const MOVIE_GENRES=[
  {id:18,label:'Drama'},{id:28,label:'Action'},{id:35,label:'Comedy'},
  {id:53,label:'Thriller'},{id:10749,label:'Romance'},{id:27,label:'Horror'},
  {id:14,label:'Fantasy'},{id:9648,label:'Mystery'},
];

const PROVIDERS=[
  {id:8, label:'Netflix'},
  {id:337, label:'Disney+'},
  {id:119, label:'Prime Video'},
  {id:152, label:'Viu'},
  {id:96, label:'Naver Store'}
];

const YEARS=[2026, 2025, 2024, 2023, 2022];

const _titleCache={};
let searchTimer;

let _browseType='tv';
let _browseGenre='';
let _browseYear='';
let _browseProvider='';
let _browseKeyword='';
let _browsePage=1;
let _prevPage='home';

/* ============================================================
   LOCAL STORAGE 
   ============================================================ */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function getFavs(){return lsGet('hd_favorites')||{}}
function setFavs(f){lsSet('hd_favorites',f)}
function isFav(id){return !!getFavs()[id]}
function toggleFav(id,type,title,poster){
  const f=getFavs();
  if(f[id]){delete f[id];setFavs(f);toast('Removed from favorites');return false;}
  else{f[id]={id,type,title,poster,addedAt:Date.now()};setFavs(f);toast('Added to favorites');return true;}
}
function getCW(){return lsGet('hd_cw')||{}}
function setCW(c){lsSet('hd_cw',c)}
function addCW(id,type,title,backdrop,progress=5){
  const c=getCW();c[id]={id,type,title,backdrop,progress,updatedAt:Date.now()};setCW(c);
}
function removeCW(id){const c=getCW();delete c[id];setCW(c);}
function updateCWProgress(id,pct){const c=getCW();if(c[id]){c[id].progress=pct;c[id].updatedAt=Date.now();setCW(c);}}

/* ============================================================
   UTILS
   ============================================================ */
window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('scrolled',scrollY>36);
  const st=document.getElementById('scroll-top');
  if(st)st.classList.toggle('show',scrollY>500);
});

function toggleMobileSearch(){
  const bar=document.getElementById('mobile-search-bar');
  if(!bar)return;
  bar.classList.toggle('open');
  document.getElementById('bn-search')?.classList.toggle('active',bar.classList.contains('open'));
  if(bar.classList.contains('open')){
    const inp=document.getElementById('search-mobile');
    if(inp)setTimeout(()=>inp.focus(),50);
  }
}
function closeMobileSearch(){
  const bar=document.getElementById('mobile-search-bar');
  if(bar)bar.classList.remove('open');
  document.getElementById('bn-search')?.classList.remove('active');
}
let _dragEl=null,_dragSX=0,_dragSS=0;
function enableDrag(el){
  if(!el)return;
  el.addEventListener('mousedown',e=>{_dragEl=el;_dragSX=e.pageX-el.offsetLeft;_dragSS=el.scrollLeft;el.style.cursor='grabbing';clearInterval(_autoSwipeInterval)});
  el.addEventListener('mousemove',e=>{if(_dragEl!==el)return;e.preventDefault();el.scrollLeft=_dragSS-(e.pageX-el.offsetLeft-_dragSX)});
}
window.addEventListener('mouseup',()=>{if(_dragEl){_dragEl.style.cursor='grab';_dragEl=null}});
async function api(path){const r=await fetch(BASE+path,{headers:H});return r.json()}
function imgUrl(p,s='w500'){
  if(!p)return`data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect fill='%231c1e2b' width='200' height='300'/></svg>`;
  return IMG+s+p;
}
function bdUrl(p){return p?IMG+'original'+p:''}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function cachedTitle(id){return _titleCache[id]||'Now Playing'}
function killIframes(){
  document.querySelectorAll('iframe').forEach(f=>{try{f.src='about:blank'}catch(e){}});
}

function scrollCarousel(id,dir){
  const c = document.getElementById(id);
  if(c){
    const cardWidth = c.querySelector('.hero-card')?.offsetWidth || window.innerWidth;
    const totalWidth = c.scrollWidth;
    
    if (dir === 1 && (c.scrollLeft + cardWidth >= totalWidth - 10)) {
      c.scrollTo({left: 0, behavior: 'smooth'});
    } else if (dir === -1 && c.scrollLeft <= 0) {
      c.scrollTo({left: totalWidth, behavior: 'smooth'});
    } else {
      c.scrollBy({left: dir * cardWidth, behavior: 'smooth'});
    }
  }
}

function startAutoSwipe(id) {
  clearInterval(_autoSwipeInterval);
  _autoSwipeInterval = setInterval(() => {
    scrollCarousel(id, 1);
  }, 5000);
}

const IC={
  play:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>`,
  star:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
  info:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`,
  back:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m12 19-7-7 7-7"/><path d="M5 12h14"/></svg>`,
  chevR:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m9 18 6-6-6-6"/></svg>`,
  chevL:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m15 18-6-6 6-6"/></svg>`,
  video:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`,
  heart:(fill=false,s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?'var(--rose)':'none'}" stroke="${fill?'var(--rose)':'currentColor'}" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  close:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  expand:(s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`,
  compress:(s=19)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>`,
};

/* ============================================================
   NAVIGATION
   ============================================================ */
function showPage(id,fromPage,navKey){
  if(id !== 'home') clearInterval(_autoSwipeInterval);
  if(id!=='player' && (fromPage==='player'||document.getElementById('page-player').classList.contains('active'))){
    killIframes();
    document.getElementById('page-player').innerHTML='';
  }
  if(fromPage)_prevPage=fromPage;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  window.scrollTo({top:0});
  ['nl-home','nl-drama','nl-movie','nl-fav','bn-home','bn-drama','bn-movie','bn-fav'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('active')});
  const map={home:['nl-home','bn-home'],'browse-tv':['nl-drama','bn-drama'],'browse-movie':['nl-movie','bn-movie'],favorites:['nl-fav','bn-fav']};

function makeCard(item,type,src='home'){
  const t=item.title||item.name||'';
  const y=(item.release_date||item.first_air_date||'').slice(0,4);
  const r=item.vote_average?item.vote_average.toFixed(1):'';
  const fav=isFav(item.id);
  const cw=getCW()[item.id];
  _titleCache[item.id]=t;
  return`<div class="card" onclick="showDetail(${item.id},'${type}','${src}')">
    <div class="card-frame">
      <img class="card-img" src="${imgUrl(item.poster_path)}" alt="${esc(t)}" loading="lazy"/>
      <div class="card-fade"></div>
      <div class="card-play">${IC.play(18)}</div>
      <div class="card-fav${fav?' faved':''}" onclick="event.stopPropagation();handleFavToggle(event,${item.id},'${type}','${esc(t)}','${item.poster_path||''}')" title="${fav?'Remove from favorites':'Add to favorites'}">${IC.heart(fav,12)}</div>
      ${cw?`<div class="cw-progress"><div class="cw-bar" style="width:${cw.progress}%"></div></div>`:''}
    </div>
    <div class="card-body">
      <div class="card-name">${esc(t)}</div>
      <div class="card-sub">${r?`<span class="card-rating">${IC.star(10)} ${r}</span>`:''}${y?`<span>${y}</span>`:''}</div>
    </div>
  </div>`;
}
function skPosters(n){return Array(n).fill(`<div class="sk sk-poster"></div>`).join('')}
function rowHtml(num,title,rowId,showMore,moreAction){
  return`<div class="section">
    <div class="section-header">
      <div class="section-title-wrap"><span class="section-num">${num}</span><div class="section-title">${title}</div></div>
      ${showMore?`<div class="section-more" onclick="${moreAction}">View chapter ${IC.chevR(12)}</div>`:''}
    </div>
    <div class="section-rule"></div>
    <div class="row-wrap">
      <button class="scroll-btn sl" onclick="scrollR('${rowId}',-1)">${IC.chevL(15)}</button>
      <div class="row" id="${rowId}">${skPosters(10)}</div>
      <button class="scroll-btn sr" onclick="scrollR('${rowId}',1)">${IC.chevR(15)}</button>
    </div>
  </div>`;
}
function scrollR(id,dir){const r=document.getElementById(id);if(r)r.scrollBy({left:dir*400,behavior:'smooth'})}
function scrollFilter(id,dir){
  const el=document.getElementById(id);
  if(!el)return;
  const btn=el.querySelector('.fbtn');
  if(!btn){el.scrollBy({left:dir*160,behavior:'smooth'});return;}
  const gap=parseFloat(getComputedStyle(el).columnGap||getComputedStyle(el).gap)||8;
  el.scrollBy({left:dir*(btn.getBoundingClientRect().width+gap),behavior:'smooth'});
}
function fillRow(id,items,type,src){
  const el=document.getElementById(id);
  if(el){el.innerHTML=items.map(i=>makeCard(i,type,src)).join('');enableDrag(el)}
}
function handleFavToggle(e,id,type,title,poster){
  e.stopPropagation();
  const added=toggleFav(id,type,title,poster);
  const btn=e.currentTarget||e.target.closest('.card-fav,.btn-ghost')||e.target;
  btn.title=added?'Remove from favorites':'Add to favorites';
  if(btn.classList.contains('card-fav')){
    btn.innerHTML=IC.heart(added,12);
    btn.classList.toggle('faved',added);
    if(!added && document.getElementById('page-favorites')?.classList.contains('active')){
      const card=btn.closest('.card');
      if(card)card.remove();
      const sub=document.querySelector('#page-favorites .browse-sub');
      const count=Object.keys(getFavs()).length;
      if(sub)sub.textContent=`${count} saved title${count!==1?'s':''}`;
      if(count===0)showFavorites();
    }
  } else {
    btn.innerHTML=`${IC.heart(added,14)} ${added?'Saved':'Save'}`;
  }
}

/* ============================================================
   CUSTOM FULLSCREEN + AUTO-HIDE CONTROLS
   ============================================================ */
function toggleFullscreen(){
  const wrap=document.getElementById('player-frame-wrap');
  if(!wrap)return;
  const fsEl=document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
  if(!fsEl){
    const req=wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.msRequestFullscreen;
    if(req)req.call(wrap);
  }else{
    const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(exit)exit.call(document);
  }
}
function updateFsIcon(){
  const btn=document.getElementById('fs-btn');
  const wrap=document.getElementById('player-frame-wrap');
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement);
  if(btn)btn.innerHTML=isFs?IC.compress():IC.expand();
  if(wrap){
    wrap.classList.remove('controls-hidden');
    clearTimeout(_fsHideTimer);
    _fsHideTimer=setTimeout(()=>wrap.classList.add('controls-hidden'),2000);
  }
}
document.addEventListener('fullscreenchange',updateFsIcon);
document.addEventListener('webkitfullscreenchange',updateFsIcon);
document.addEventListener('msfullscreenchange',updateFsIcon);

let _fsHideTimer=null;
function initPlayerControls(){
  const wrap=document.getElementById('player-frame-wrap');
  if(!wrap)return;
  const revealControls=()=>{
    wrap.classList.remove('controls-hidden');
    clearTimeout(_fsHideTimer);
    _fsHideTimer=setTimeout(()=>wrap.classList.add('controls-hidden'),2000);
  };
  wrap.addEventListener('mousemove',revealControls);
  wrap.addEventListener('mouseenter',revealControls);
  wrap.addEventListener('click',revealControls);
  wrap.addEventListener('touchstart',revealControls,{passive:true});
  wrap.addEventListener('mouseleave',()=>{
    clearTimeout(_fsHideTimer);
    wrap.classList.add('controls-hidden');
  });
  // Clicking inside the embedded (cross-origin) video shifts focus into the
  // iframe, which fires a window blur event. Use that as a non-blocking
  // signal to wake the controls without intercepting the click itself.
  window.addEventListener('blur',()=>{
    if(document.activeElement&&document.activeElement.id==='player-iframe')revealControls();
  });
  revealControls();
}
async function loadTVSeasons(id,currentSeason,currentEp){
  try{
    const data=await api(`/tv/${id}`);
    _tvSeasons=(data.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0);
    if(!_tvSeasons.length)return;
    const tabsEl=document.getElementById('season-tabs');
    if(tabsEl){
      tabsEl.innerHTML=_tvSeasons.map(s=>`
        <button class="season-tab${s.season_number===currentSeason?' active':''}" onclick="loadEpisodes(${id},${s.season_number})">Season ${s.season_number}</button>`).join('');
    }
    await loadEpisodes(id,currentSeason,currentEp);
  }catch(e){console.error(e);}
}
async function loadEpisodes(id,season,highlightEp){
  document.querySelectorAll('.season-tab').forEach(b=>{b.classList.toggle('active',b.textContent.trim()===`Season ${season}`);});
  const grid=document.getElementById('ep-grid');
  if(grid)grid.innerHTML=Array(6).fill(`<div class="sk sk-block" style="height:78px"></div>`).join('');
  _currentPlay.season=season;
  highlightEp=highlightEp||_currentPlay.episode;
  try{
    const data=await api(`/tv/${id}/season/${season}`);
    const eps=(data.episodes||[]);
    _tvEpisodes=eps;
    _currentPlay.totalEp=eps.length;
    updateEpNavButtons();
    if(grid){
      grid.innerHTML=eps.length?eps.map(ep=>{
        const isActive=ep.episode_number===highlightEp&&season===_currentPlay.season;
        const thumb=ep.still_path?`https://image.tmdb.org/t/p/w300${ep.still_path}`
          :`data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='169'><rect fill='%231c1e2b' width='300' height='169'/></svg>`;
        const runtime=ep.runtime?`${ep.runtime}m`:'';
        return`<div class="ep-card${isActive?' active':''}" id="ep-card-${ep.episode_number}" onclick="switchEpisode(${season},${ep.episode_number})">
          <div class="ep-thumb-wrap">
            <img class="ep-thumb" src="${thumb}" alt="E${ep.episode_number}" loading="lazy"/>
            <div class="ep-play-overlay">${IC.play(20)}</div>
          </div>
          <div class="ep-body2">
            <div class="ep-num">S${season} · E${ep.episode_number}</div>
            <div class="ep-name">${esc(ep.name||'Episode '+ep.episode_number)}</div>
            ${ep.overview?`<div class="ep-desc">${esc(ep.overview)}</div>`:''}
            ${runtime?`<div class="ep-runtime">${runtime}</div>`:''}
          </div>
        </div>`;
      }).join('')
      :`<div style="color:var(--muted);font-size:14px;padding:20px 0">No episodes found.</div>`;
    }
    setTimeout(()=>{const activeCard=document.getElementById(`ep-card-${highlightEp}`);if(activeCard)activeCard.scrollIntoView({behavior:'smooth',block:'nearest'});},100);
  }catch(e){if(grid)grid.innerHTML=`<div style="color:var(--muted);font-size:14px;padding:20px 0">Could not load episodes.</div>`;}
}
function switchEpisode(season,ep){
  _currentPlay.season=season;_currentPlay.episode=ep;
  const s=SOURCES[_activeSrc];
  const frame=document.getElementById('player-iframe');
  if(frame)frame.src=s.urlTV(_currentPlay.id,season,ep);
  window.scrollTo({top:0,behavior:'smooth'});
  const subEl=document.getElementById('player-sub-info');
  if(subEl)subEl.innerHTML=`<span>Season ${season} · Episode ${ep}</span><span>HANDRAMA Player</span>`;
  const nowLabel=document.getElementById('ep-now-label');
  if(nowLabel)nowLabel.innerHTML=`<span class="ep-dot"></span> S${season} E${ep}`;
  document.querySelectorAll('.ep-card').forEach(c=>c.classList.remove('active'));
  const activeCard=document.getElementById(`ep-card-${ep}`);
  if(activeCard){activeCard.classList.add('active');activeCard.scrollIntoView({behavior:'smooth',block:'nearest'});}
  updateEpNavButtons();
  toast(`Playing S${season} E${ep}`);
  updateCWProgress(_currentPlay.id,30);
}
function updateEpNavButtons(){
  const prevBtn=document.getElementById('btn-prev-ep');
  const nextBtn=document.getElementById('btn-next-ep');
  if(!prevBtn||!nextBtn)return;
  prevBtn.disabled=(_currentPlay.episode<=1&&_currentPlay.season<=1);
  nextBtn.disabled=(_currentPlay.episode>=_currentPlay.totalEp&&_currentPlay.season>=_tvSeasons.length);
}
function prevEpisode(){
  const {season,episode}=_currentPlay;
  if(episode>1){switchEpisode(season,episode-1);}
  else{
    const prevSeason=_tvSeasons.find(s=>s.season_number===season-1);
    if(prevSeason){
      _currentPlay.season=prevSeason.season_number;_currentPlay.episode=prevSeason.episode_count;
      loadEpisodes(_currentPlay.id,prevSeason.season_number,prevSeason.episode_count);
      switchEpisode(prevSeason.season_number,prevSeason.episode_count);
    }
  }
}
function nextEpisode(){
  const {season,episode,totalEp}=_currentPlay;
  if(episode<totalEp){switchEpisode(season,episode+1);}
  else{
    const nextSeason=_tvSeasons.find(s=>s.season_number===season+1);
    if(nextSeason){
      _currentPlay.season=nextSeason.season_number;_currentPlay.episode=1;
      loadEpisodes(_currentPlay.id,nextSeason.season_number,1);
      switchEpisode(nextSeason.season_number,1);
    }
  }
}
function stopAndGoBack(){
  const frame=document.getElementById('player-iframe');
  if(frame){frame.src='about:blank';}
  if(_currentPlay.id)updateCWProgress(_currentPlay.id,50);
  showPage('detail');
}
function playTrailer(key,id,type){
  const title=cachedTitle(id);
  _currentPlay={id,type,season:1,episode:1,totalEp:0};
  const pg=document.getElementById('page-player');
  pg.innerHTML=`
    <div class="player-pg">

      </div>

  showPage('player');
}

      <div class="filter-label">Service:</div>

        <button class="filter-arrow fal" onclick="scrollFilter('fbar-provider',-1)" aria-label="Scroll left">${IC.chevL(14)}</button>

        </div>

    <div class="filter-group" style="margin-bottom:30px">
      <div class="filter-label">Genre:</div>

          ${genreList.map(g=>`<button class="fbtn ${String(genreId)===String(g.id)?'active':''}" onclick="setFilter('genre', '${g.id}')">${g.label}</button>`).join('')}

    </div>

async function setFilter(type, val){
  if(type === 'year') _browseYear = val;
  if(type === 'provider') _browseProvider = val;
  if(type === 'genre') { _browseGenre = val; _browseKeyword = ''; }
  if(type === 'keyword') { _browseKeyword = val; _browseGenre = ''; }
  _browsePage = 1;

  const updateBtns = (idPrefix, currentVal, typeCheck) => {
    const btns = document.getElementById(idPrefix)?.querySelectorAll('.fbtn');
    if(btns){
      btns.forEach(b => {
        const btnVal = b.textContent.trim();
        let isActive = false;
        
        if(!currentVal && (btnVal === 'Any' || btnVal === 'All')) {
          isActive = true;
        } else if (currentVal && (b.getAttribute('onclick').includes(`'${currentVal}'`) || b.getAttribute('onclick').includes(`, ${currentVal})`))) {
          isActive = true;
        }
        
        b.classList.toggle('active', isActive);
      });
    }
  }

  updateBtns('fbar-year', _browseYear);
  updateBtns('fbar-provider', _browseProvider);
  
  const genreBtns = document.getElementById('fbar-genre')?.querySelectorAll('.fbtn');
  if(genreBtns){
    genreBtns.forEach(b => {
      const isAll = b.textContent.trim() === 'All';
      if(!_browseGenre && !_browseKeyword && isAll) {
         b.classList.add('active');
      } else if (_browseGenre && b.getAttribute('onclick').includes(`'${_browseGenre}'`)) {
         b.classList.add('active');
      } else if (_browseKeyword && b.getAttribute('onclick').includes(`'${_browseKeyword}'`)) {
         b.classList.add('active');
      } else {
         b.classList.remove('active');
      }
    });
  }

  const grid=document.getElementById('bgrid');
  if(grid)grid.innerHTML=Array(20).fill('<div class="sk sk-poster" style="width:100%"></div>').join('');
  await fetchBrowsePage(true);
}

async function fetchBrowsePage(replace){
  const today = new Date().toISOString().slice(0, 10);
  let url = `/discover/${_browseType}?with_original_language=${KO}&page=${_browsePage}`;
  const dateParam = _browseType === 'tv' ? 'first_air_date' : 'primary_release_date';
  
  url += `&sort_by=${dateParam}.desc`;
  
  if(_browseGenre) url += `&with_genres=${_browseGenre}`;
  if(_browseKeyword && _browseType === 'tv') url += `&with_keywords=${_browseKeyword}`;
  
  if(_browseYear) {
    url += `&${dateParam}_year=${_browseYear}`;
  } else {
    url += `&${dateParam}.gte=2024-01-01&${dateParam}.lte=${today}`;
  }
  
  if(_browseProvider) url += `&with_watch_providers=${_browseProvider}&watch_region=KR`;

  try {
    const data=await api(url);
    const grid=document.getElementById('bgrid');
    if(!grid)return;
    
    const items = data.results || [];
    const cards=items.map(i=>makeCard(i,_browseType,'browse')).join('');
    
    if(replace) {
      grid.innerHTML = cards || `<div style="color:var(--muted);font-size:14px;grid-column:1/-1;padding:30px 0;text-align:center">No titles found for these filters.</div>`;
    } else {
      grid.innerHTML += cards;
    }
  } catch (error) {
    console.error("Browse API Error", error);
    const grid=document.getElementById('bgrid');
    if(grid && replace) {
      grid.innerHTML = `<div style="color:var(--muted);font-size:14px;grid-column:1/-1;padding:30px 0;text-align:center">Error loading titles.</div>`;
    }
  }
}
async function loadMoreBrowse(){_browsePage++;await fetchBrowsePage(false);toast(`Page ${_browsePage} loaded`)}

async function handleSearch(q){
  clearTimeout(searchTimer);
  document.getElementById('search-input').value=q;
  const mob=document.getElementById('search-mobile');
  if(mob&&mob!==document.activeElement)mob.value=q;
  if(!q.trim()){goHome();return}
  searchTimer=setTimeout(async()=>{
    showPage('search');closeMobileSearch();
    const pg=document.getElementById('page-search');
    pg.innerHTML=`<div class="search-pg">
      <div style="margin-bottom:20px"><button class="btn-back" onclick="goHome()">${IC.back()} Home</button></div>
      <div class="search-heading">Results for "${esc(q)}"</div>
      <div class="results-grid" id="sgrid">${Array(12).fill('<div class="sk sk-poster" style="width:100%"></div>').join('')}</div>
    </div>`;
    try {
      const data=await api(`/search/multi?query=${encodeURIComponent(q)}&page=1`);
      const items=(data.results||[]).filter(i=>i.media_type!=='person'&&i.poster_path&&i.original_language===KO);
      const grid=document.getElementById('sgrid');
      if(grid)grid.innerHTML=items.length
        ?items.map(i=>makeCard(i,i.media_type||'tv','search')).join('')
        :`<div style="color:var(--muted);font-size:14px;grid-column:1/-1;padding:30px 0;text-align:center">No Korean titles found for "${esc(q)}".</div>`;
    } catch (error) {
      const grid=document.getElementById('sgrid');
      if(grid) grid.innerHTML=`<div style="color:var(--muted);font-size:14px;grid-column:1/-1;padding:30px 0;text-align:center">Error fetching search results.</div>`;
    }
  },380);
}
