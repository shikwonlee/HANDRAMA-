<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>StreamVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--bg2:#0a0a0b;--bg3:#101012;
  --card:#131315;--card2:#1a1a1d;
  --red:#e50914;--red2:#ff3b3b;
  --acc2:#22d3ee;
  --gold:#f5c518;--text:#f5f5f7;--muted:#8a8a92;
  --border:#232326;--nav-h:64px;
  --radius:14px;--radius-sm:8px;
  --px:48px;
  --content-top: calc(var(--nav-h) + 26px);
}
html{scroll-behavior:smooth}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 900px 500px at 15% -10%,rgba(229,9,20,.14),transparent),radial-gradient(ellipse 700px 500px at 100% 0%,rgba(34,211,238,.06),transparent);background-repeat:no-repeat;color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;min-height:100vh}
html{background:var(--bg)}
button,a{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);display:flex;align-items:center;padding:0 var(--px);gap:20px;transition:background .3s,box-shadow .3s;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--border)}
#nav.scrolled{background:rgba(5,5,5,.98);box-shadow:0 1px 0 var(--border)}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:25px;letter-spacing:3px;cursor:pointer;flex-shrink:0;white-space:nowrap;background:linear-gradient(90deg,var(--red2),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:2px}
.nav-link{padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--muted);transition:color .2s,background .2s;cursor:pointer;white-space:nowrap}
.nav-link:hover,.nav-link.active{color:var(--text);background:rgba(255,255,255,.07)}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.search-wrap{position:relative;display:flex;align-items:center}
#search-input{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:8px 34px 8px 14px;font-size:13px;color:var(--text);width:190px;transition:width .3s,border-color .3s,background .3s;font-family:inherit}
#search-input:focus{outline:none;border-color:var(--red);width:240px;background:var(--bg3)}
#search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;right:10px;color:var(--muted);pointer-events:none}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.nav-search-btn{display:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);flex-shrink:0;color:var(--text);border:1px solid var(--border)}
.mobile-search-bar{position:fixed;top:var(--nav-h);left:0;right:0;z-index:999;background:rgba(10,10,20,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 14px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
.mobile-search-bar.open{max-height:70px;padding:12px 14px}
.mobile-search-bar input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:20px;padding:10px 16px;font-size:14px;color:var(--text);font-family:inherit}
.mobile-search-bar input:focus{outline:none;border-color:var(--red)}

/* PAGES */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* HERO */
.hero{position:relative;height:88vh;min-height:480px;overflow:hidden;display:flex;align-items:flex-end}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(8,9,14,.6) 38%,rgba(8,9,14,.1) 70%,transparent 100%)}
.hero-grad2{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,9,14,.7) 0%,transparent 65%)}
.hero-content{position:relative;z-index:2;padding:0 var(--px) 56px;max-width:660px}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:var(--red);padding:3px 10px 3px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6.5vw,82px);line-height:.95;margin-bottom:12px;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.hero-meta{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hero-rating{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:3px}
.hero-desc{font-size:13.5px;line-height:1.7;color:rgba(238,240,245,.72);margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-btns{display:flex;gap:9px;flex-wrap:wrap}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;padding:11px 22px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;transition:background .18s,transform .15s;white-space:nowrap}
.btn-primary:hover{background:var(--red2);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;padding:11px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:500;border:1px solid rgba(255,255,255,.14);transition:background .18s,transform .15s;white-space:nowrap}
.btn-ghost:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.btn-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:color .18s;padding:4px 0}
.btn-back:hover{color:var(--text)}

/* SECTIONS */
.section{padding:28px var(--px)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.8px}
.section-more{font-size:12px;color:var(--red);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px;padding:6px 0;transition:color .18s;white-space:nowrap}
.section-more:hover{color:var(--red2)}

/* SERVICES ROW */
.services-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none;-webkit-user-select:none}
.services-row:active{cursor:grabbing}
.services-row::-webkit-scrollbar{height:0}
.svc-chip{flex:0 0 auto;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;scroll-snap-align:start;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.svc-chip:hover{border-color:var(--red);background:var(--card2);transform:translateY(-2px)}
.svc-chip:active{transform:scale(.97)}
.svc-dot{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.5px;color:#fff;font-weight:700}
.svc-name{font-size:13px;font-weight:600}
.svc-sub{font-size:11px;color:var(--muted)}

/* CARD ROW */
.row-wrap{position:relative;margin:0 -10px}
.row{display:flex;gap:10px;overflow-x:auto;padding:4px 10px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none;-webkit-user-select:none}
.row:active{cursor:grabbing}
.row::-webkit-scrollbar{height:0}
.scroll-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:38px;height:38px;border-radius:50%;background:rgba(10,10,20,.92);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.5);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s,transform .18s,border-color .18s,opacity .2s;pointer-events:auto}
.scroll-btn:hover{background:var(--red);border-color:var(--red);transform:translateY(-50%) scale(1.08)}
.scroll-btn:active{transform:translateY(-50%) scale(.95)}
.scroll-btn.sl{left:2px}
.scroll-btn.sr{right:2px}

/* POSTER CARD */
.card{flex:0 0 auto;width:140px;border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;scroll-snap-align:start;transition:transform .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.card:hover{transform:scale(1.06) translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.65);z-index:5}
.card:active{transform:scale(.97)}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--card)}
.card-fade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,14,.95) 0%,transparent 55%);opacity:0;transition:opacity .25s}
.card:hover .card-fade{opacity:1}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:9px;transform:translateY(4px);opacity:0;transition:transform .25s,opacity .25s}
.card:hover .card-info{transform:translateY(0);opacity:1}
.card-name{font-size:11px;font-weight:600;line-height:1.3;margin-bottom:2px}
.card-rating{font-size:10px;color:var(--gold);display:flex;align-items:center;gap:2px}
.card-year{font-size:10px;color:var(--muted);margin-top:1px}
.card-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.75);width:40px;height:40px;border-radius:50%;background:rgba(229,9,20,.9);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .25s}
.card:hover .card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* WIDE CARD */
.wcard{flex:0 0 auto;width:236px;border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;scroll-snap-align:start;transition:transform .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.wcard:hover{transform:scale(1.04) translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.65);z-index:5}
.wcard:active{transform:scale(.97)}
.wcard-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card)}
.wcard-body{padding:8px 10px 10px;background:var(--card)}
.wcard-name{font-size:12px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard-meta{font-size:10px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* FAV / CW BADGE */
.card-fav{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;opacity:0;transition:opacity .2s;border:1px solid rgba(255,255,255,.15)}
.card:hover .card-fav{opacity:1}
.card-fav.faved{opacity:1;background:rgba(229,9,20,.8)}
.cw-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15)}
.cw-bar{height:100%;background:var(--red);transition:width .3s}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-poster{width:140px;aspect-ratio:2/3;flex:0 0 auto}
.sk-wide{width:236px;aspect-ratio:16/9;flex:0 0 auto;border-radius:var(--radius)}
.sk-block{border-radius:var(--radius-sm)}

/* DETAIL PAGE */
.dp{padding-top:var(--nav-h);min-height:100vh}
.dp-hero{position:relative;height:70vh;min-height:420px;overflow:hidden}
.dp-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.dp-grad{position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 30%,transparent 70%),linear-gradient(to top,var(--bg) 0%,transparent 52%)}
.dp-inner{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;padding:0 var(--px) 48px;gap:28px}
.dp-poster{width:160px;flex-shrink:0;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.8)}
.dp-poster img{width:100%;aspect-ratio:2/3;object-fit:cover}
.dp-info{flex:1;min-width:0}
.genre-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.genre-tag{padding:3px 10px;border-radius:20px;background:rgba(229,9,20,.12);border:1px solid rgba(229,9,20,.28);font-size:11px;color:var(--red);font-weight:500}
.dp-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,5.5vw,68px);line-height:1;margin-bottom:9px}
.dp-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.dp-rating{display:flex;align-items:center;gap:5px;color:var(--gold);font-size:16px;font-weight:700}
.dp-desc{font-size:13.5px;line-height:1.72;color:rgba(238,240,245,.72);max-width:560px;margin-bottom:20px}
.dp-btns{display:flex;gap:9px;flex-wrap:wrap}
.dp-body{padding:28px var(--px)}
.cast-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.cast-row::-webkit-scrollbar{height:0}
.cast-card{flex:0 0 auto;width:88px;text-align:center}
.cast-img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--card);margin:0 auto 6px;border:2px solid var(--border)}
.cast-name{font-size:10px;font-weight:600;line-height:1.3}
.cast-char{font-size:10px;color:var(--muted);margin-top:2px}

/* BROWSE */
.browse-pg{padding:var(--content-top) var(--px) 60px}
.browse-title{font-family:'Bebas Neue',sans-serif;font-size:42px;margin-bottom:3px}
.browse-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.fbtn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .18s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.fbtn:hover,.fbtn.active{background:var(--red);border-color:var(--red);color:#fff}
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* SERVICE PAGE */
.svc-pg{padding-top:var(--content-top);min-height:100vh}
.svc-header{padding:28px var(--px) 0}
.svc-header-inner{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.svc-logo-big{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:#fff;flex-shrink:0}
.svc-pg-title{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;line-height:1}
.svc-pg-sub{color:var(--muted);font-size:13px}
.svc-empty{color:var(--muted);font-size:13px;padding:20px 4px;white-space:nowrap}

/* SEARCH */
.search-pg{padding:var(--content-top) var(--px) 60px}
.search-heading{font-family:'Bebas Neue',sans-serif;font-size:28px;margin-bottom:18px}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

/* PLAYER */
.player-pg{background:#000;min-height:100vh;padding-top:var(--nav-h)}
.player-top{padding:12px var(--px);display:flex;align-items:center;gap:12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.player-frame-wrap{max-width:1280px;margin:0 auto;background:#000;position:relative}
.player-frame-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.fs-btn{position:absolute;top:10px;right:10px;z-index:30;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s,opacity .35s;opacity:1;pointer-events:auto}
.fs-btn.fs-hidden{opacity:0;pointer-events:none}
.fs-btn:hover{background:var(--red)}
.player-frame-wrap:fullscreen{display:flex;align-items:center}
.player-frame-wrap:fullscreen iframe{aspect-ratio:auto;height:100vh}
.player-body{max-width:1280px;margin:0 auto;padding:20px var(--px) 40px}
.player-title{font-family:'Bebas Neue',sans-serif;font-size:30px;margin-bottom:5px}
.player-sub{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.player-note{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.6}
.source-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.src-btn{padding:7px 14px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .18s;font-family:inherit}
.src-btn:hover,.src-btn.active{background:var(--red);border-color:var(--red);color:#fff}

/* EPISODE PANEL */
.ep-panel{max-width:1280px;margin:0 auto;padding:0 var(--px) 40px}
.ep-section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.6px;margin-bottom:12px;padding-top:24px;border-top:1px solid var(--border)}
.season-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.season-tab{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit;-webkit-tap-highlight-color:transparent}
.season-tab:hover,.season-tab.active{background:var(--red);border-color:var(--red);color:#fff}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ep-card{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .2s,background .2s,transform .18s;-webkit-tap-highlight-color:transparent}
.ep-card:hover{border-color:var(--red);background:var(--card2);transform:translateY(-2px)}
.ep-card.active{border-color:var(--red);background:var(--card2)}
.ep-card.active .ep-num{color:var(--red)}
.ep-thumb-wrap{position:relative;flex-shrink:0;width:120px}
.ep-thumb{width:120px;height:72px;object-fit:cover;background:var(--bg3);display:block}
.ep-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.ep-card:hover .ep-play-overlay,.ep-card.active .ep-play-overlay{opacity:1}
.ep-body{padding:8px 10px 8px 0;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ep-num{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase}
.ep-name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep-desc{font-size:11px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep-runtime{font-size:10px;color:var(--muted);margin-top:4px}
.ep-nav-bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.ep-nav-btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 16px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;font-family:inherit}
.ep-nav-btn:hover:not(:disabled){background:var(--red);border-color:var(--red)}
.ep-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.ep-now-playing{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ep-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:600px){.ep-grid{grid-template-columns:1fr}.ep-thumb-wrap{width:100px}.ep-thumb{width:100px;height:60px}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:580px;max-height:84vh;overflow-y:auto;padding:30px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .18s,color .18s}
.modal-close:hover{background:var(--red);color:#fff}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;margin-bottom:14px;color:var(--text)}
.modal-body{font-size:13.5px;color:rgba(238,240,245,.75);line-height:1.75}
.modal-body h3{font-size:14px;font-weight:700;color:var(--text);margin:18px 0 7px}
.modal-body p{margin-bottom:11px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .28s;pointer-events:none;max-width:280px}
#toast.show{opacity:1;transform:translateY(0)}

/* FOOTER */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:36px var(--px);margin-top:40px}
.footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:28px;margin-bottom:24px}
.footer-brand .nav-logo{font-size:20px;margin-bottom:7px;display:block}
.footer-brand p{font-size:12px;color:var(--muted);line-height:1.7;max-width:240px}
.footer-col h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;color:var(--muted)}
.footer-col a{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;cursor:pointer;transition:color .18s}
.footer-col a:hover{color:var(--text)}
.footer-bottom{border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;gap:8px}
.tmdb-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.tmdb-badge span{background:#01b4e4;color:#000;padding:2px 6px;border-radius:3px;font-weight:700;font-size:10px}

/* FLOATING BOTTOM NAV (mobile) */
.bottom-nav{position:fixed;left:14px;right:14px;bottom:14px;z-index:1100;display:none;align-items:center;justify-content:space-around;background:rgba(14,14,28,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:8px 6px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;padding:6px 10px;border-radius:14px;transition:color .18s,background .18s;flex:1;-webkit-tap-highlight-color:transparent}
.bn-item svg{transition:transform .18s}
.bn-item.active{color:var(--text);background:rgba(229,9,20,.18)}
.bn-item.active svg{transform:translateY(-1px)}
.bn-item:active{transform:scale(.94)}

/* CONTINUE WATCHING */
.cw-card{flex:0 0 auto;width:220px;border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;scroll-snap-align:start;transition:transform .25s,box-shadow .25s;background:var(--card)}
.cw-card:hover{transform:scale(1.04) translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.65)}
.cw-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--card2)}
.cw-body{padding:8px 10px 10px}
.cw-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.cw-meta{font-size:10px;color:var(--muted)}
.cw-prog-wrap{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px}
.cw-prog-bar{height:100%;background:var(--red);border-radius:2px}
.cw-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s;color:var(--muted);font-size:12px}
.cw-card:hover .cw-remove{opacity:1}

/* RESPONSIVE */
@media(max-width:900px){
  :root{--px:20px;--nav-h:56px}

  .dp-poster{display:none}
  .hero{height:75vh}
  .scroll-btn{display:none}
  footer{margin-bottom:70px}
}
@media(max-width:600px){

  .sk-poster{width:120px}
  .wcard{width:200px}
  .sk-wide{width:200px}
  .browse-grid,.results-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

  .dp-title{font-size:28px}

@media(hover:none){
  .card-fade{opacity:1}
  .card-info{opacity:1;transform:translateY(0)}
  .card-fav{opacity:1}
}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

function getFavs(){return lsGet('sv_favorites')||{}}
function setFavs(f){lsSet('sv_favorites',f)}
function isFav(id){return !!getFavs()[id]}
function toggleFav(id,type,title,poster){
  const f=getFavs();

  else{f[id]={id,type,title,poster,addedAt:Date.now()};setFavs(f);toast('Added to favorites ❤');return true;}

  c[id]={id,type,title,backdrop,progress,updatedAt:Date.now()};
  setCW(c);
}
function removeCW(id){const c=getCW();delete c[id];setCW(c);}
function updateCWProgress(id,pct){

function toggleMobileSearch(){
  const bar=document.getElementById('mobile-search-bar');

function closeMobileSearch(){document.getElementById('mobile-search-bar')?.classList.remove('open')}
function enableDrag(el){
  if(!el)return;
  let sx,ss,drag=false,moved=false;
  el.addEventListener('mousedown',e=>{sx=e.pageX-el.offsetLeft;ss=el.scrollLeft;drag=true;moved=false;el.style.cursor='grabbing'});
  window.addEventListener('mouseup',()=>{drag=false;if(el)el.style.cursor='grab'});
  el.addEventListener('mousemove',e=>{if(!drag)return;e.preventDefault();moved=true;el.scrollLeft=ss-(e.pageX-el.offsetLeft-sx)});
  // Prevent accidental card clicks right after a drag
  el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
  syncScrollBtns(el);
  el.addEventListener('scroll',()=>syncScrollBtns(el));
}
// Keep the left/right scroll buttons in sync with actual scroll position
// so the "scroll left" arrow is only shown/enabled when there's content to scroll back to.
function syncScrollBtns(el){
  const wrap=el.closest('.row-wrap');
  if(!wrap)return;
  const sl=wrap.querySelector('.scroll-btn.sl');
  const sr=wrap.querySelector('.scroll-btn.sr');
  const maxScroll=el.scrollWidth-el.clientWidth-2;
  if(sl){
    const atStart=el.scrollLeft<=2;
    sl.style.opacity=atStart?'0':'1';
    sl.style.pointerEvents=atStart?'none':'auto';
  }
  if(sr){
    const atEnd=maxScroll<=0||el.scrollLeft>=maxScroll;
    sr.style.opacity=atEnd?'0':'1';
    sr.style.pointerEvents=atEnd?'none':'auto';
  }
}

}

      f.src=src; // reset — actually we want to blank it

  });
}

/* ============================================================
   FULLSCREEN
   ============================================================ */
function toggleFullscreen(wrapId){
  const el=document.getElementById(wrapId);
  if(!el)return;
  const isFs=document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement;
  if(!isFs){
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen)el.mozRequestFullScreen();
    else if(el.msRequestFullscreen)el.msRequestFullscreen();
    else{
      // Fallback for iOS/browsers without Fullscreen API on divs — try the iframe itself
      const frame=el.querySelector('iframe');
      if(frame&&frame.requestFullscreen)frame.requestFullscreen();
      else if(frame&&frame.webkitEnterFullscreen)frame.webkitEnterFullscreen();
      else toast('Fullscreen not supported on this browser');
    }
  } else {
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    else if(document.mozCancelFullScreen)document.mozCancelFullScreen();
    else if(document.msExitFullscreen)document.msExitFullscreen();
  }
}
// Auto-hide the fullscreen button after 2s of no cursor movement inside the player,
// and bring it back the moment the mouse moves again.
function attachAutoHideFsBtn(wrapId){
  const wrap=document.getElementById(wrapId);
  if(!wrap)return;
  const btn=wrap.querySelector('.fs-btn');
  if(!btn)return;
  let hideTimer;
  const show=()=>{
    btn.classList.remove('fs-hidden');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>btn.classList.add('fs-hidden'),2000);
  };
  wrap.addEventListener('mousemove',show);
  wrap.addEventListener('mouseenter',show);
  wrap.addEventListener('touchstart',show,{passive:true});
  show();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
let _navStack=['home'];
function showPage(id,fromPage,skipHistory){
  // Kill any playing iframes before navigating away from player
  if(fromPage==='player'||document.getElementById('page-player').classList.contains('active')){
    killIframes();
    // Blank out player page content to fully stop audio
    document.getElementById('page-player').innerHTML='';
  }
  if(fromPage)_prevPage=fromPage;
  const cur=document.querySelector('.page.active')?.id?.replace('page-','');
  if(!skipHistory&&cur&&cur!==id){
    _navStack.push(id);
    if(_navStack.length>25)_navStack.shift();
  }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  window.scrollTo({top:0});
  ['nl-home','nl-movies','nl-tv','nl-svc','nl-fav','dl-home','dl-movies','dl-tv','dl-svc','dl-fav'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('active')});
  const map={home:['nl-home','dl-home'],browse:['nl-movies','dl-movies'],service:['nl-svc','dl-svc'],favorites:['nl-fav','dl-fav']};
  (map[id]||[]).forEach(x=>{const el=document.getElementById(x);if(el)el.classList.add('active')});
}
function goHome(){_navStack=['home'];showPage('home',null,true);if(!document.querySelector('.hero-bg'))initHome();}
function goBack(){
  // Always kill iframes when going back
  killIframes();
  // Pop the current page, then land on whatever's beneath it
  if(_navStack.length>1)_navStack.pop();
  const target=_navStack[_navStack.length-1]||'home';
  showPage(target,null,true);
  if(target==='home'&&!document.querySelector('.hero-bg'))initHome();
}

  const r=item.vote_average?item.vote_average.toFixed(1):'';

  _titleCache[item.id]=t;
  return`<div class="card" onclick="showDetail(${item.id},'${type}','${src}')">
    <img class="card-img" src="${imgUrl(item.poster_path)}" alt="${esc(t)}" loading="lazy"/>

    <div class="card-play">${IC.play(17)}</div>
    <div class="card-fav${fav?' faved':''}" onclick="event.stopPropagation();handleFavToggle(event,${item.id},'${type}','${esc(t)}','${item.poster_path||''}')" title="${fav?'Remove from favorites':'Add to favorites'}">${IC.heart(fav,11)}</div>
    <div class="card-info">

      ${r?`<div class="card-rating">${IC.star(10)} ${r}</div>`:''}

function makeWCard(item,type,src='home'){

function skPosters(n){return Array(n).fill(`<div class="sk sk-poster"></div>`).join('')}

function rowHtml(title,rowId,wide,showMore,moreAction){
  return`<div class="section">
    <div class="section-header">
      <div class="section-title">${title}</div>
      ${showMore?`<div class="section-more" onclick="${moreAction}">See all ${IC.chevR()}</div>`:''}
    </div>
    <div class="row-wrap">
      <button class="scroll-btn sl" onclick="scrollR('${rowId}',-1)">${IC.chevL()}</button>

function scrollR(id,dir){const r=document.getElementById(id);if(r)r.scrollBy({left:dir*300,behavior:'smooth'})}
function fillRow(id,items,type,wide,src){
  const el=document.getElementById(id);
  if(el){el.innerHTML=items.map(i=>wide?makeWCard(i,type,src):makeCard(i,type,src)).join('');enableDrag(el)}
}

function handleFavToggle(e,id,type,title,poster){
  e.stopPropagation();
  const added=toggleFav(id,type,title,poster);
  // Update all heart icons for this item
  document.querySelectorAll(`[data-favid="${id}"]`).forEach(el=>{
    el.innerHTML=IC.heart(added,11);
    el.classList.toggle('faved',added);
  });
  // Quick DOM update for the clicked button
  const btn=e.currentTarget||e.target;
  btn.innerHTML=IC.heart(added,11);
  btn.classList.toggle('faved',added);
  btn.title=added?'Remove from favorites':'Add to favorites';
}

function switchSvcTab(tab){
  const moviesPanel=document.getElementById('svc-panel-movies');
  const tvPanel=document.getElementById('svc-panel-tv');
  const moviesBtn=document.getElementById('svc-tab-movies');
  const tvBtn=document.getElementById('svc-tab-tv');
  if(!moviesPanel||!tvPanel)return;
  if(tab==='movies'){
    moviesPanel.style.display='';tvPanel.style.display='none';
    if(moviesBtn){moviesBtn.style.borderBottomColor='var(--red)';moviesBtn.style.color='var(--text)';}
    if(tvBtn){tvBtn.style.borderBottomColor='transparent';tvBtn.style.color='var(--muted)';}
  } else {
    moviesPanel.style.display='none';tvPanel.style.display='';
    if(tvBtn){tvBtn.style.borderBottomColor='var(--red)';tvBtn.style.color='var(--text)';}
    if(moviesBtn){moviesBtn.style.borderBottomColor='transparent';moviesBtn.style.color='var(--muted)';}
  }
}

async function loadProviderRowMultiRegion(rowId,providerId,mediaType,genreId,regions){
  // Try each region until we get results
  const genreParam=genreId?`&with_genres=${genreId}`:'';
  let items=[];
  for(const region of (regions||['US','PH','KR','JP','CN'])){
    const url=`/discover/${mediaType}?with_watch_providers=${providerId}&watch_region=${region}${genreParam}&sort_by=popularity.desc&page=1`;
    try{
      const data=await api(url);
      const res=(data.results||[]).slice(0,20);
      // Merge unique results
      for(const r of res){
        if(!items.find(x=>x.id===r.id))items.push(r);
      }
      if(items.length>=8)break; // enough items, stop hitting API
    }catch(e){}
  }
  const el=document.getElementById(rowId);
  if(!el)return;
  if(items.length){el.innerHTML=items.slice(0,20).map(i=>makeCard(i,mediaType,'service')).join('');enableDrag(el);}
  else el.innerHTML=`<div class="svc-empty">No titles found for this category.</div>`;
}

async function loadCustomRow(rowId,apiPath,mediaType){
  try{
    const data=await api(apiPath);
    const items=(data.results||[]).slice(0,20);
    const el=document.getElementById(rowId);
    if(!el)return;
    if(items.length){el.innerHTML=items.map(i=>makeCard(i,mediaType,'service')).join('');enableDrag(el);}
    else el.innerHTML=`<div class="svc-empty">No titles found.</div>`;
  }catch(e){}
}

/* Load all seasons for a TV show */
async function loadTVSeasons(id,currentSeason,currentEp){
  try{
    const data=await api(`/tv/${id}`);
    _tvSeasons=(data.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0);
    if(!_tvSeasons.length)return;
    const tabsEl=document.getElementById('season-tabs');
    if(tabsEl){
      tabsEl.innerHTML=_tvSeasons.map(s=>`
        <button class="season-tab${s.season_number===currentSeason?' active':''}" onclick="loadEpisodes(${id},${s.season_number})">
          Season ${s.season_number}
        </button>`).join('');
    }
    await loadEpisodes(id,currentSeason,currentEp);
  }catch(e){console.error(e);}
}

/* Load episodes for a given season */
async function loadEpisodes(id,season,highlightEp){
  // Update active season tab
  document.querySelectorAll('.season-tab').forEach(b=>{
    b.classList.toggle('active',b.textContent.trim()===`Season ${season}`);
  });
  const grid=document.getElementById('ep-grid');
  if(grid)grid.innerHTML=Array(6).fill(`<div class="sk sk-block" style="height:72px"></div>`).join('');
  _currentPlay.season=season;
  highlightEp=highlightEp||_currentPlay.episode;

  try{
    const data=await api(`/tv/${id}/season/${season}`);
    const eps=(data.episodes||[]);
    _tvEpisodes=eps;
    _currentPlay.totalEp=eps.length;
    updateEpNavButtons();
    if(grid){
      grid.innerHTML=eps.length?eps.map(ep=>{
        const isActive=ep.episode_number===highlightEp&&season===_currentPlay.season;
        const thumb=ep.still_path?`https://image.tmdb.org/t/p/w300${ep.still_path}`
          :`data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='169'><rect fill='%23181c2a' width='300' height='169'/></svg>`;
        const runtime=ep.runtime?`${ep.runtime}m`:'';
        return`<div class="ep-card${isActive?' active':''}" id="ep-card-${ep.episode_number}" onclick="switchEpisode(${season},${ep.episode_number})">
          <div class="ep-thumb-wrap">
            <img class="ep-thumb" src="${thumb}" alt="E${ep.episode_number}" loading="lazy"/>
            <div class="ep-play-overlay">${IC.play(20)}</div>
          </div>
          <div class="ep-body">
            <div class="ep-num">S${season} · E${ep.episode_number}</div>
            <div class="ep-name">${esc(ep.name||'Episode '+ep.episode_number)}</div>
            ${ep.overview?`<div class="ep-desc">${esc(ep.overview)}</div>`:''}
            ${runtime?`<div class="ep-runtime">${runtime}</div>`:''}
          </div>
        </div>`;
      }).join('')
      :`<div style="color:var(--muted);font-size:13px;padding:20px 0">No episodes found.</div>`;
    }
    // Scroll active episode into view
    setTimeout(()=>{
      const activeCard=document.getElementById(`ep-card-${highlightEp}`);
      if(activeCard)activeCard.scrollIntoView({behavior:'smooth',block:'nearest'});
    },100);
  }catch(e){if(grid)grid.innerHTML=`<div style="color:var(--muted);font-size:13px;padding:20px 0">Could not load episodes.</div>`;}
}

/* Switch to a specific episode */
function switchEpisode(season,ep){
  _currentPlay.season=season;
  _currentPlay.episode=ep;
  // Update iframe
  const s=SOURCES[_activeSrc];
  const frame=document.getElementById('player-iframe');
  if(frame)frame.src=s.urlTV(_currentPlay.id,season,ep);
  // Scroll to top of player
  window.scrollTo({top:0,behavior:'smooth'});
  // Update UI labels
  const subEl=document.getElementById('player-sub-info');
  if(subEl)subEl.innerHTML=`<span>Season ${season} · Episode ${ep}</span><span>StreamVault Player</span>`;
  const nowLabel=document.getElementById('ep-now-label');
  if(nowLabel)nowLabel.innerHTML=`<span class="ep-dot"></span> S${season} E${ep}`;
  // Highlight active card
  document.querySelectorAll('.ep-card').forEach(c=>c.classList.remove('active'));
  const activeCard=document.getElementById(`ep-card-${ep}`);
  if(activeCard){activeCard.classList.add('active');activeCard.scrollIntoView({behavior:'smooth',block:'nearest'});}
  updateEpNavButtons();
  toast(`Playing S${season} E${ep}`);
  updateCWProgress(_currentPlay.id,30);
}

function updateEpNavButtons(){
  const prevBtn=document.getElementById('btn-prev-ep');
  const nextBtn=document.getElementById('btn-next-ep');
  if(!prevBtn||!nextBtn)return;
  prevBtn.disabled=(_currentPlay.episode<=1&&_currentPlay.season<=1);
  nextBtn.disabled=(_currentPlay.episode>=_currentPlay.totalEp&&_currentPlay.season>=_tvSeasons.length);
}

function prevEpisode(){
  const {season,episode}=_currentPlay;
  if(episode>1){switchEpisode(season,episode-1);}
  else{
    // Go to last episode of previous season
    const prevSeason=_tvSeasons.find(s=>s.season_number===season-1);
    if(prevSeason){
      _currentPlay.season=prevSeason.season_number;
      _currentPlay.episode=prevSeason.episode_count;
      loadEpisodes(_currentPlay.id,prevSeason.season_number,prevSeason.episode_count);
      switchEpisode(prevSeason.season_number,prevSeason.episode_count);
    }
  }
}

function nextEpisode(){
  const {season,episode,totalEp}=_currentPlay;
  if(episode<totalEp){switchEpisode(season,episode+1);}
  else{
    // Go to first episode of next season
    const nextSeason=_tvSeasons.find(s=>s.season_number===season+1);
    if(nextSeason){
      _currentPlay.season=nextSeason.season_number;
      _currentPlay.episode=1;
      loadEpisodes(_currentPlay.id,nextSeason.season_number,1);
      switchEpisode(nextSeason.season_number,1);
    }
  }
}

function stopAndGoBack(){

  terms:{title:'Terms of Use',body:`<h3>Acceptance</h3><p>By using StreamVault you agree to these terms. For personal, non-commercial use only.</p><h3>Content Disclaimer</h3><p>StreamVault embeds third-party streaming sources and does not host, upload, or distribute any copyrighted content.</p><h3>Affiliation</h3><p>StreamVault is not affiliated with Netflix, Prime Video, Apple TV+, Viu, WeTV, Crunchyroll, iWantTFC, Max, Disney+, or any streaming service.</p>`},
  contact:{title:'Contact',body:`<h3>Data Issues</h3><p>For incorrect movie/show info, contribute corrections at <strong>themoviedb.org</strong>.</p><h3>DMCA</h3><p>StreamVault does not host content. For DMCA concerns contact the respective hosting services directly.</p>`},
};
function openModal(key){const c=INFO[key];if(!c)return;document.getElementById('modal-title').textContent=c.title;document.getElementById('modal-body').innerHTML=c.body;document.getElementById('info-modal').classList.add('open')}
function closeInfoModal(){document.getElementById('info-modal').classList.remove('open')}
function closeModal(e){if(e.target===document.getElementById('info-modal'))closeInfoModal()}
